services:
  mysql:
    image: mysql:8.0.41
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - ./schema/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=pass
      - MYSQL_DATABASE=db
      - MYSQL_USER=app
      - MYSQL_PASSWORD=pass